[project]
name = "cloze"
version = "0.0.0"
description = "PDF 빈칸 학습 서비스"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20.1",
    "google-genai>=2.33",
    "pdfplumber>=0.11.10",
    "pillow>=13.0",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "pypdfium2>=5.14",
    "sqlalchemy[asyncio]>=2.1.8",
]

[dependency-groups]
dev = [
    "bandit>=1.8",
    "mypy>=1.18",
    "pytest>=9.1",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E/F: 기본 오류, I: import 정렬, B: 흔한 버그 패턴, UP: 최신 문법, C90: 순환 복잡도
select = ["E", "F", "I", "B", "UP", "C90"]

[tool.ruff.lint.mccabe]
# 강의 목표는 함수당 CC 5 이하. CI는 10을 넘으면 실패시키고, 5 초과는 리뷰에서 다룬다.
max-complexity = 10

[tool.mypy]
python_version = "3.13"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
