name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv는 주 버전 태그(v10)를 제공하지 않아 정확한 버전으로 고정한다
      - uses: astral-sh/setup-uv@v10.3.2
      - name: 의존성 설치 (uv.lock 그대로)
        run: uv sync --locked
      - name: 린트
        run: uv run ruff check .
      - name: 포맷
        run: uv run ruff format --check .
      - name: 타입 검사
        run: uv run mypy cloze tests
      - name: 보안 검사
        run: uv run bandit -r cloze -q
      - name: 테스트
        run: uv run pytest
