name: Image

# develop에 들어오면 운영 이미지를 GitHub Container Registry에 올린다(ADR-007 끌어오기 배포).
# PR에서는 Dockerfile·의존성이 바뀌었을 때 빌드와 연기 테스트만 하고 올리지 않는다.
# develop은 PR CI를 통과한 것만 머지되므로, push 때 CI를 다시 기다리지 않는다.
on:
  push:
    branches: [develop]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - deploy/**
      - pyproject.toml
      - uv.lock
      - frontend/package.json
      - frontend/package-lock.json
      - .github/workflows/image.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/best-vibing/cloze
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4.4.1
      # 연기 테스트를 하려고 먼저 내 실행기에 이미지를 만든다(push 전).
      - name: 빌드 (linux/amd64)
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:test
      # 배포 이미지에서 패키지를 못 찾는 문제(-I로 실행하는 하위 프로세스 포함)를 올리기 전에 잡는다.
      - name: 연기 테스트
        run: docker run --rm "$IMAGE:test" python -I -c "import cloze.api.app, cloze.worker"
      - name: GHCR 로그인
        if: github.event_name == 'push'
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 태그 붙여 올리기
        if: github.event_name == 'push'
        run: |
          docker tag "$IMAGE:test" "$IMAGE:develop"
          docker tag "$IMAGE:test" "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:develop"
          docker push "$IMAGE:sha-$GITHUB_SHA"
