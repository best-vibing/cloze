# 운영(시연 기기) 구성. 개발용은 레포 루트의 docker-compose.yml이다.
# 실행: docker compose -f deploy/compose.yml up -d   (값은 deploy/.env, 예시는 deploy/.env.example)
# 서비스 역할은 아키텍처 7장, 결정은 ADR-007.
#
# scheduler(ADR-011)는 등록할 정리 작업(#30)이 생길 때 함께 추가한다.

x-app: &app
  image: ghcr.io/best-vibing/cloze:${CLOZE_IMAGE_TAG:-develop}
  env_file: .env
  environment:
    # 컨테이너 안 경로. API와 워커가 같은 볼륨을 본다.
    CLOZE_STORAGE_DIR: /data/storage
  volumes:
    - storage:/data/storage

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: cloze
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?deploy/.env에 POSTGRES_PASSWORD가 필요하다}
      POSTGRES_DB: cloze
    # 호스트 포트를 열지 않는다. 같은 compose 안의 서비스만 접속한다.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "cloze"]
      interval: 2s
      retries: 15
    restart: unless-stopped

  redis:
    image: redis:7
    # AOF: Redis가 재시작돼도 쌓인 작업을 잃지 않는다(ADR-001). 비밀번호가 없어 포트를 열지 않는다.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 15
    restart: unless-stopped

  # 한 번 돌고 끝난다. api·worker는 이게 성공한 뒤에 시작한다(마이그레이션은 추가만).
  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    # 127.0.0.1에만 연다. 바깥 노출은 호스트의 Tailscale(Serve·Funnel)이 맡는다.
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      retries: 3
    restart: unless-stopped

  worker:
    <<: *app
    # 프로세스 하나가 작업을 하나씩만 처리한다(신뢰성 설계 5절). 발표 때는 메모리가 허락하는 만큼 늘린다.
    command: ["taskiq", "worker", "cloze.worker:broker", "--max-async-tasks", "1"]
    # [가설] WSL2 기본 상한(메모리의 절반, 약 8GB) 안에서 정한 값. 실측(#83) 뒤 조정한다.
    mem_limit: 2g
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  storage:
