# Keep this file ASCII only: Alembic reads it with the OS locale encoding (cp949 on Korean Windows).
# DB URL is not here; migrations/env.py reads it from Settings (CLOZE_DATABASE_URL).
[alembic]
script_location = %(here)s/cloze/infra/db/migrations
prepend_sys_path = .
path_separator = os
# Date prefix keeps migration files listed in creation order.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
